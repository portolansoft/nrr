limitations:
  - "Yields are an average of two runs; no error bars or replicate counts beyond that are reported."
  - "The amine screen (Table 1) is read from a colour-coded image: green for less than 5 percent product, pink for product observed; no yields are given per cell."
  - "Schemes S3 and S4 (extra TMEDA) give their yields in images that were not transcribed."
nextSteps:
  - "Rely on observing the TMEDA.(BH3)2 adduct by 11B NMR rather than on inhibition alone."
  - "Treat any HBpin hydroboration run at or above 80 °C as susceptible to hidden BH3 catalysis."
openQuestions:
  - "Is there any amine or other trap that sequesters BH3 irreversibly above 60 °C under hydroboration conditions?"
  - "Which of the published 'true catalysis' claims validated by TMEDA above 60 °C survive a re-test below 60 °C or by 11B NMR?"
