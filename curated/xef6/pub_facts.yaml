thermodynamics:
  fia: "fluoride ion affinities recalculated at RIJK-PW6B95(D3BJ)-ATM/def2-QZVPP geometries with CCSD(T)/def2-QZVPP energies, with and without a CPCM solvent model for HF (epsilon 84): [XeF5]+ -367 (CP) / -662 kJ/mol; [XeF7]+ -379 / -865; RuF5 -462 / -514 (equations 10 to 12)"
  reactionEnthalpies: "XeF6 + RuF5 to [XeF5]+[RuF6]-: -95 (CP) / +148 kJ/mol; XeF8 + RuF5 to [XeF7]+[RuF6]-: -83 (CP) / +351 kJ/mol (equations 13, 14): exothermic with the solvent model, endothermic without"
  latticeEnergies: "Bartlett's formula U_L = 2329.1 (FUV)^-1/3 + 110.1: [XeF5][RuF6] -516 kJ/mol (FUV 188.6 A3); putative [XeF7][RuF6] -489 kJ/mol (FUV 232 A3, using the IF7 volume for the cation and 119 A3 for [RuF6]-)"
  formationEnergies: "[XeF5][RuF6] overall -611 (CP) / -368 kJ/mol; [XeF7][RuF6] overall -572 (CP) / -138 kJ/mol, 'which indicates that [XeF7][RuF6] would be a feasible compound'"
  instability: "XeF8 formation enthalpy about -172 kJ/mol but unstable to F2 loss by about 93 kJ/mol at 0 K; [XeF7]+ unstable to F2 loss by about 191 kJ/mol at 0 K (Grant et al. 2010); packing into a solid may stabilise it"
  redoxPotentials: "no redox potentials or Galvanic series exist for anhydrous HF; the authors leave their calculation to others"
  verdict: "So, why does RuF6 fail to oxidize XeF6? Well, it may be that our reaction conditions are not right, yet. ... Under the conditions investigated by us so far, we only observe F2 elimination and no evidence of any Xe(VIII) compound."
  conclusionHypothesis: "quantum-chemical calculations and considerations of reaction and lattice energies suggest that an ionic solid containing [XeF7]+ cations may be stable; the decomposition of [XeF7]+ cations may be too fast in our case"
  software: "CRYSTAL23 (DFT-PBE0, TZVP, 4x4x2 k-grid, spin-polarised, ferromagnetic Ru ordering, band gap 5.31 eV, local moment 2.30 muB); ORCA 6.1.1 for FIAs; CRYSPLOT for mode assignment"
limitations:
  - "The number of reactions per condition is not reported anywhere in the article or SI."
  - "No positive control for the oxidation was run alongside: the oxidising power of RuF6 toward BrF5 is cited from the authors' earlier work, not re-demonstrated here."
  - "Products of the excess-RuF6 reactions could not be quantified; the reaction equation (6) is marked hypothetical."
  - "No detection limit for [XeF7]+ by Raman is stated; the predicted band positions are given."
nextSteps:
  - "Find conditions under which [XeF7]+ survives long enough to be trapped as an ionic solid, since the thermodynamic estimates do not rule out [XeF7][RuF6]."
  - "Establish redox potentials or a Galvanic series for anhydrous HF."
openQuestions:
  - "Is [XeF7]+ formed transiently and lost by F2 elimination, or never formed at all under these conditions?"
  - "Would a solvent other than aHF, or a different counter-anion, change the outcome, given that the salt also forms neat?"
