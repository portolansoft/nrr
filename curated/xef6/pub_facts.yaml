purpose: "Oxidise XeF6 with RuF6 in anhydrous HF to a xenon(VIII) fluoride species, XeF8 or a [XeF7]+ salt, which no fluoride-only route has ever produced."
target:
  species: "[XeF7]+ salt, for example [XeF7][Ru2F11] or [XeF7][RuF6], or XeF8"
  rationale: "RuF6 is, with [KrF]+ and [NiF3]+, one of only three oxidisers able to oxidise BrF5 to [BrF6]+, and it is far less Lewis acidic than the two cations, so it should not simply abstract fluoride from XeF6 as they do"
  stoichiometry: "RuF6 is a one-electron oxidiser, so a 2:1 RuF6:XeF6 ratio was supposed for a complete reaction (equation 3)"
priorDeadEnds:
  - {oxidant: F2, outcome: "XeF8 suggested by Slivnik and co-workers; attempts to make it from F2 and Xe failed; predicted thermodynamically unstable to F2 loss", dois: [10.1016/0022-1902(70)80296-2, 10.1021/ic50046a026, 10.1021/ic901956g]}
  - {oxidant: "[KrF]+", outcome: "XeF6 is a fluoride ion donor; the reaction gives KrF2 and [XeF5]+ (equation 1)", dois: [10.1016/S0010-8545(02)00202-3]}
  - {oxidant: "[NiF3]+", outcome: "gives [NiF6]2- and [XeF5]+ (equation 2); in aHF at -65 degrees C [XeF5]2[NiF6], or with excess XeF6 [Xe2F11]2[NiF6], with no F2 evolution", dois: [10.1021/ic00314a008, 10.1021/ja00145a013]}
observations:
  decolorisation: "the intensive brown RuF6 decolorised immediately when the HF melted, especially with XeF6 in excess; taken as first evidence of a complete reaction"
  f2Detection: "the solution was cooled to -196 degrees C and the remaining gas phase pumped through KI powder, which turned brown from I2; since the other fluorinating agents are not volatile at -196 degrees C this was an unambiguous indication of F2 (vapour pressure about 370 mbar at that temperature)"
  volatility: "RuF6 89 mbar at 17.6 degrees C and XeF6 38.5 mbar at 25 degrees C, so the exact stoichiometric ratio is hard to meet"
  xef7Bands: "the most intense Raman bands of [XeF7]+ were quantum-chemically predicted at 588, 647 and 503 cm-1 and were not present"
  ruf6Stability: "pure RuF6 decomposes slowly to RuF5 and F2 at room temperature (weeks in nickel); salt formation from RuF6 and XeF6 is essentially instantaneous, so RuF6 decomposition is not thought to be the decisive step"
  neat: "[Xe2F11][RuF6] also forms without aHF, so the solvent does not seem to play a role"
