publication:
  doi: 10.57844/arcadia-pdu7-q2zz
  title: Evaluation of Alcalase pretreatment for Chlamydomonas reinhardtii CRISPR knock-in
  subtitle: "To edit cell-walled C. reinhardtii, you must first digest the wall to deliver Cas9 RNPs and donor DNA. We tried the off-the-shelf enzyme Alcalase and found that it digested walls, but sharply reduced viability, and we recovered no CRISPR knock-ins. A one-time cautionary result."
