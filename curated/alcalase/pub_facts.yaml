protocol:
  synchronization: "14 h light / 10 h dark for four days before transformation; Fluval Plant 4.0 LED Nano lamps, 11,000 lux at culture surface"
  cultureFormats: {flask: "50 mL TAP in 250 mL flask, 25 C, 250 rpm, harvested at mid-log OD750 = 0.3", plate: "lawn on TAP + 1.5% agar at ambient temperature, scraped and resuspended to OD750 ~ 0.33"}
  alcalase: "1:10 dilution of Alcalase (Sigma-Aldrich 126741) in TAP, 10 mL per pellet, 1 h in LED grow tent (~7,000 lux, ambient temperature, no shaking); washed twice with TAP + 40 mM sucrose"
  geneart: "washed twice in 10 mL undiluted GeneArt MAX Efficiency Transformation Reagent for Algae (Thermo Fisher A24229)"
  noEnzymeControl: "M-N medium in place of Alcalase/TAP, same procedure"
  leakageAssay: "OD662 before (OD1) and after 50% TAP / 50% 0.1% Triton X-100 vortex (OD2); leakage = OD2/OD1 x 100% (Hwang et al. 2018)"
  rnp: "Alt-R S. pyogenes Cas9 V3 (IDT 1081058) with annealed Alt-R crRNA:tracrRNA (IDT 1072533), 5 uM each, 4 uL RNP per reaction"
  donor: "linear 1,589 bp HDR donor: HSP70A-RBCS2::RBCS2i1::NAT::RBCS2-T flanked by 50 bp homology arms, released by SapI (NEB R0569S), gel-purified (Zymo D4001), 1 ug per transformation; synthesised by Twist Bioscience in pTwist Amp High Copy"
  electroporation: "Gene Pulser Xcell (Bio-Rad), 4 mm cuvettes (VWR 89047-210), 500 V, 50 uF, 800 Ohm; 250 uL cells; recovery overnight in TAP + 40 mM sucrose, dark, 150 rpm"
  selection: "TAP agar + 7.5 ug/mL nourseothricin (NAT); controls plated on TAP after 100x dilution; 5-7 days in grow tent"
  colonyCounting: "Epson V700 flatbed scanner at 600 dpi on days 7 and 12; Fiji v2.16.0/1.54p multi-point tool"
  colonyPcr: "1 uL of 96-deep-well culture as template; PrimeSTAR GXL Premix Fast (Takara R052A); expected ~0.5 kb wild type, ~2 kb HDR insert; 2% E-Gel (Invitrogen G700802) or 1% agarose"
  ampliconSequencing: "unpurified PCR products from 40 colonies (10 per guide) sequenced by Angstrom Innovation (Oxford Nanopore); compared with C. reinhardtii v5.6 in Geneious Prime v2026.0.2"
  guideDesign: "Geneious Prime v2026.0.2; Azimuth 2.0 on-target scores; MIT specificity scores"
