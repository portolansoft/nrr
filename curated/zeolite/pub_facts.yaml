results:
  headline: "Experimental synthesis using a shortlist of OSDAs predicted to favor STF or IFR, in addition to AEI or CHA, did not yield the expected aluminosilicate products, and instead, amorphous materials were obtained in most cases."
  verdict: "our experiments did not result in AEI or CHA being synthesized (neither STF nor IFR), and hence in this sense our predictions from calculations must be considered a failure"
  explanation:
    - "the driving force in aluminosilicate composition is OSDA packing and aluminium incorporation (lower Si/Al), not the short-range zeolite-OSDA van der Waals interaction, so AEI and CHA are predicted to dominate"
    - "all three OSDAs degraded or were structurally modified during synthesis, which prevented the intended structure-directing effect"
    - "OSDA stability under hydrothermal conditions and nucleation kinetics are not represented in the synthesis-energy model; defects and solvation were not modelled"
  verdictSource: Conclusions
limitations:
  - "No known-good OSDA was run alongside as a positive control for the hydrothermal protocol, so an amorphous product cannot be separated from a protocol failure."
  - "Product identification is by powder XRD; no detection limit for a minority crystalline phase is stated."
  - "The STF OSDA was a mixture of stereoisomers of which the computed isomer was about one quarter."
  - "The number of autoclaves per table entry is not stated; each SI entry lists two sampling times."
nextSteps:
  - "Include solvent effects, especially how water and counter-cations influence framework stability and OSDA-framework interaction, in the phase prediction."
  - "Examine OSDA stability under hydrothermal conditions, since degradation during synthesis can prevent structure direction."
  - "Link computational insight with experimental feedback to guide zeolite crystallisation."
openQuestions:
  - "Can aluminosilicate STF or IFR be crystallised in hydroxide media at all, given that CHA and AEI are predicted to be more stable for every OSDA screened?"
  - "Would the predicted phases (CHA, AEI) have formed if the OSDAs had survived the hydrothermal conditions?"
