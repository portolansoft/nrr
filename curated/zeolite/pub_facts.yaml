purpose: "Use synthesis-energy calculations, machine-learning classifiers and de novo design over more than 10,000 organic structure-directing agents to find OSDAs that would crystallise the aluminosilicate forms of the STF and IFR zeolites in hydroxide media, then test the shortlist hydrothermally."
