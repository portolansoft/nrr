  IFR: "large-pore zeolite, undulating 12-ring channels about 6.2 x 7.2 A; obtained as an aluminosilicate only with benzylquinuclidinium cations, usually in fluoride media"
  constraint: "synthesis in hydroxide media, without fluoride"
