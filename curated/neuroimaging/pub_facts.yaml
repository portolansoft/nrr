  title: Label-free neuroimaging in mice captures sensory activity in response to tactile stimuli and acute pain
  subtitle: "Sensory disorders are clinically common, debilitating conditions. But mouse behavioral models are often insufficient. We demonstrate that label-free, minimally invasive brain imaging in mice could be a promising avenue for sensory research or drug discovery efforts."
