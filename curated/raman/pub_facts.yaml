# Statements transcribed from Cheveralls et al. 2026 (The Stacks) with their location in the pub.
publication:
  doi: 10.57844/arcadia-xdmk-yq0w
  title: Leave-one-batch-out cross-validation reveals strong batch effects in Raman spectroscopy of yeast cultures
  subtitle: "We acquired spontaneous Raman spectra of several strains and species of yeast. We found that experimental batch effects dominate strain-level biological signals in our dataset, yielding misleadingly high classification accuracy under standard cross-validation."
  venue: The Stacks (Astera Institute)
  publisher: Astera Institute
