  doi: 10.57844/arcadia-9768-f6c5
  title: A structurally divergent actin conserved in fungi has no association with specific traits
  subtitle: "We outline a comparative approach to investigate protein function by correlating the presence or absence of a protein with species-level phenotypes. We applied this strategy to a novel actin isoform in fungi but didn't find an association with any of the phenotypes we considered."
